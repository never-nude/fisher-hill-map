name: Update Fisher Hill mentions

on:
  schedule:
    - cron: "23 11 * * 3"   # Wednesdays 11:23 UTC — catches minutes posted after each 2nd-Tuesday meeting
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Scan minutes for Fisher Hill mentions
        run: node scripts/update-mentions.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- fisher-hill-mentions.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fisher-hill-mentions.json
            git commit -m "Update Fisher Hill meeting mentions"
            git push
          fi
